pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }
rootProject.name = 'MyMonitor'
include ':app'

include ':libausbc', ':libuvc', ':libnative'
['libausbc', 'libuvc', 'libnative'].each { n -> project(":" + n).projectDir = file("vendor/AndroidUSBCamera/" + n) }
