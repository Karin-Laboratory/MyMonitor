name: Build APK and Windows Receiver
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mymonitor-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Verify v016 spec implementation paths
        run: python3 scripts/spec_contract_test.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: mymonitor-explicit-debug-signing-v2
      - name: Prepare cached development signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          test "$(gh api repos/${GH_REPO}/git/ref/tags/v0.16 --jq '.object.sha')" = "${GITHUB_SHA}"
      - name: Fetch pinned upstream UVC and apply MJPEG tap
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch 3.6.0 https://github.com/ernestp/AndroidUSBCamera.git vendor/AndroidUSBCamera
          test "$(git -C vendor/AndroidUSBCamera rev-parse HEAD)" = "09df386a46e6aef22e4a020105246b2c9805ed05"
          python3 scripts/patch_uvc_mjpeg.py vendor/AndroidUSBCamera
      - name: Build bundled native UVC and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk mymonitor016.apk
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix python3-cairosvg python3-pil
      - name: Embed matching Android icon and compile standalone EXE
        run: |
          /usr/bin/python3 scripts/make_windows_icon.py
          cd windows
          x86_64-w64-mingw32-windres receiver.rc -O coff -o receiver-res.o
          x86_64-w64-mingw32-g++-posix receiver.cpp receiver-res.o -o ../mycastreceiver016.exe -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -municode -mwindows -lws2_32 -lgdiplus -lshlwapi -lole32 -lwinmm
      - name: Check packages and checksums
        run: |
          test -s mymonitor016.apk
          file mycastreceiver016.exe | grep 'PE32+'
          sha256sum mymonitor016.apk mycastreceiver016.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mymonitor016
          path: |
            mymonitor016.apk
            mycastreceiver016.exe
            TRANSFER.md
            SPEC_AUDIT_016.md
            SHA256SUMS.txt
  windows-test:
    needs: build
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mymonitor016 }
      - name: Test actual EXE with Full HD images
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new(1920,1080)
          $g = [System.Drawing.Graphics]::FromImage($image)
          $g.Clear([System.Drawing.Color]::CornflowerBlue)
          $image.Save("$pwd/test.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $g.Dispose()
          $image.Dispose()
          python windows/smoke_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Burst frame low-latency ACK and async decoder diagnostics
        shell: pwsh
        run: |
          python windows/latency_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify receiver V2 identity and reject unrelated TCP/DHCP services
        shell: pwsh
        run: |
          python windows/discovery_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PCM audio port accepts audio packets
        shell: pwsh
        run: |
          python windows/audio_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Two-minute stream soak with bad frames and reconnects
        shell: pwsh
        run: |
          python windows/soak_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  publish:
    needs: windows-test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mymonitor016 }
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.16 >/dev/null 2>&1; then
            gh release upload v0.16 mymonitor016.apk mycastreceiver016.exe TRANSFER.md SPEC_AUDIT_016.md SHA256SUMS.txt --clobber
            # A same-version v016 correction must have release/tag AND binary
            # assets point at the same tested commit, not an earlier attempt.
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/v0.16" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit v0.16 --target "${GITHUB_SHA}"
          else
            gh release create v0.16 mymonitor016.apk mycastreceiver016.exe TRANSFER.md SPEC_AUDIT_016.md SHA256SUMS.txt --target "${GITHUB_SHA}" --title 'My Monitor 016 + Low-latency Windows Receiver' --notes 'Source/lifecycle repair: unplug UVC returns to Android screen or requests consent, known Windows IP verified directly before UDP fallback, notification start/stop/record state, independent screen recording. v015 low-latency JPEG/ACK/GDI pipeline retained. Matching monitor icon embedded. Windows receiver smoke-tested. Pixel/Wi-Fi end-to-end latency needs device measurement. Update BOTH APK and EXE.'
          fi
          test "$(gh api \"repos/${GH_REPO}/git/ref/tags/v0.16\" --jq '.object.sha')" = "${GITHUB_SHA}"
