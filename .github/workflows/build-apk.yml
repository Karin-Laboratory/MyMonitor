name: Build APK and Windows Receiver
on:
  push:
    branches: [main, v037-uvc-chroma-stride-fix]
  workflow_dispatch:
concurrency:
  group: mymonitor-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Verify v037 source/lifecycle/audio/provenance contracts
        run: python3 scripts/spec_contract_test.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: mymonitor-explicit-debug-signing-v2
      - name: Prepare cached development signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Fetch pinned UVC library and apply independent MJPEG tap
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch 3.6.0 https://github.com/ernestp/AndroidUSBCamera.git vendor/AndroidUSBCamera
          test "$(git -C vendor/AndroidUSBCamera rev-parse HEAD)" = "09df386a46e6aef22e4a020105246b2c9805ed05"
          python3 scripts/patch_uvc_mjpeg.py vendor/AndroidUSBCamera
      - name: Verify UVC NV12 chroma format and codec plane padding
        run: python3 scripts/test_uvc_chroma_layout.py
      - name: Build Android UVC/native and APK with unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk mymonitor037.apk
      - name: Create original monitor icon for native Windows build
        run: |
          sudo apt-get update && sudo apt-get install -y python3-cairosvg python3-pil
          python3 scripts/make_windows_icon.py
          test -s windows/monitor.ico
      - uses: actions/upload-artifact@v4
        with:
          name: mymonitor037-android-and-icon
          path: |
            mymonitor037.apk
            windows/monitor.ico
            TRANSFER.md
            SPEC_FIX_037.md

  windows-test:
    needs: build
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mymonitor037-android-and-icon }
      - name: Compile Windows EXE natively using discovered MSVC (not MinGW)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe is missing on GitHub Windows runner" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No installed MSVC C++ toolchain was found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "MSVC environment script not found at $vcvars" }
          Write-Host "Building native Windows EXE with MSVC from $vs"
          $script = @(
            "@echo off",
            ('call "{0}"' -f $vcvars),
            "if errorlevel 1 exit /b 1",
            "cd windows",
            "rc /nologo /fo receiver-res.res receiver.rc",
            "if errorlevel 1 exit /b 1",
            "cl /nologo /std:c++17 /utf-8 /O2 /EHsc /MT /Fe:..\mycastreceiver037.exe receiver.cpp receiver-res.res ws2_32.lib user32.lib gdi32.lib gdiplus.lib shlwapi.lib ole32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /MACHINE:X64",
            "if errorlevel 1 exit /b 1",
            "cd .."
          )
          Set-Content -Path build-msvc-037.cmd -Value $script -Encoding ascii
          & cmd.exe /d /c build-msvc-037.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC compilation or resource linking failed ($LASTEXITCODE)" }
          if (-not (Test-Path mycastreceiver037.exe)) { throw "Missing MSVC output executable" }
      - name: Check Windows EXE metadata and Defender if available
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\mycastreceiver037.exe").Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.FileVersion -ne "0.37.0.0") { throw "PE version metadata missing: $($info.FileVersion)" }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Authenticode status: $($sig.Status). Signing requires a trusted certificate not available in CI."
          $defender = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($defender -and $defender.AMServiceEnabled -and $defender.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              @($_.Resources) -match [regex]::Escape("mycastreceiver037.exe")
            })
            if ($hits.Count -gt 0) { throw "Microsoft Defender detected the built executable: $($hits | Out-String)" }
            Write-Host "Defender scan of hosted CI executable completed with no reported detection."
          } else {
            Write-Host "Defender scanning unavailable on this hosted runner; NOT a Defender-clean verdict."
          }
      - name: Test actual EXE with Full HD MJPEG and reconnect
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new(1920,1080)
          $g = [System.Drawing.Graphics]::FromImage($image)
          $g.Clear([System.Drawing.Color]::CornflowerBlue)
          $image.Save("$pwd/test.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $g.Dispose()
          $image.Dispose()
          python windows/smoke_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check 140-frame early ACK and async decoder timing
        shell: pwsh
        run: |
          python windows/latency_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check verified UDP/TCP receiver discovery and false-host rejection
        shell: pwsh
        run: |
          python windows/discovery_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three consecutive audio TCP sessions (screen lock/unlock regression)
        shell: pwsh
        run: |
          python windows/audio_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remote control framing defaults OFF (MMC5 + 17 bytes)
        shell: pwsh
        run: |
          python windows/control_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MMC6 UVC source switching and reversible F11 fullscreen
        shell: pwsh
        run: |
          python windows/mode_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify rapid Ctrl-wheel coalescing and real reverse-control ACKs
        shell: pwsh
        run: |
          python windows/wheel_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: v037 remote keyboard UTF-8 and safe-off regression on native EXE
        shell: pwsh
        run: |
          python windows/keyboard_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Two-minute reliability and corrupted JPEG regression
        shell: pwsh
        run: |
          python windows/soak_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify published APK and MSVC EXE checksums
        shell: pwsh
        run: |
          $files = @('mymonitor037.apk', 'mycastreceiver037.exe')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Missing $file" } }
      - uses: actions/upload-artifact@v4
        with:
          name: mymonitor037-verified
          path: |
            mymonitor037.apk
            mycastreceiver037.exe
            TRANSFER.md
            SPEC_FIX_037.md
            SHA256SUMS.txt

  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows-test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mymonitor037-verified }
      - name: Publish only fully tested APK and MSVC EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.37 >/dev/null 2>&1; then
            gh release upload v0.37 mymonitor037.apk mycastreceiver037.exe TRANSFER.md SPEC_FIX_037.md SHA256SUMS.txt --clobber
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/v0.37" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit v0.37 --target "${GITHUB_SHA}"
          else
            gh release create v0.37 mymonitor037.apk mycastreceiver037.exe TRANSFER.md SPEC_FIX_037.md SHA256SUMS.txt --target "${GITHUB_SHA}" --title 'MyMonitor 037 + Native Windows Receiver' --notes 'v037: correct UVC recording colors and red/blue frame displacement by honoring Android MediaCodec YUV_420_888 Image.Plane rowStride and pixelStride while preserving native NV12 U/V order. Keep v036 crash-safe Android USB audio MP4 remux and low latency Windows video. Verify with a real UVC source.'
          fi
          test "$(gh api repos/${GH_REPO}/git/ref/tags/v0.37 --jq '.object.sha')" = "${GITHUB_SHA}"
