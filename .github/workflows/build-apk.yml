name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mymonitor-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk mymonitor005.apk
      - uses: actions/upload-artifact@v4
        with: { name: mymonitor005, path: mymonitor005.apk }
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.05 >/dev/null 2>&1; then
            gh release upload v0.05 mymonitor005.apk --clobber
          else
            gh release create v0.05 mymonitor005.apk \
              --title "My Monitor v0.05" \
              --notes "Alpha: normalized video filenames, encrypted saved SMB credentials, monitor icon, two-tone record button. Device test pending."
          fi
