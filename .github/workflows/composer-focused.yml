name: Windows composer focused regression
on:
  push:
    branches: [v033-composer-debug]
permissions: { contents: read }
env:
  PYTHONUTF8: "1"
jobs:
  composer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows EXE natively using discovered MSVC (not MinGW)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe is missing on GitHub Windows runner" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No installed MSVC C++ toolchain was found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "MSVC environment script not found at $vcvars" }
          Write-Host "Building native Windows EXE with MSVC from $vs"
          $script = @(
            "@echo off",
            ('call "{0}"' -f $vcvars),
            "if errorlevel 1 exit /b 1",
            "cd windows",
            "if errorlevel 1 exit /b 1",
            "cl /nologo /std:c++17 /utf-8 /O2 /EHsc /MT /Fe:..\mycastreceiver033.exe receiver.cpp ws2_32.lib user32.lib gdi32.lib gdiplus.lib shlwapi.lib ole32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /MACHINE:X64",
            "if errorlevel 1 exit /b 1",
            "cd .."
          )
          Set-Content -Path build-msvc-033.cmd -Value $script -Encoding ascii
          & cmd.exe /d /c build-msvc-033.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC compilation or resource linking failed ($LASTEXITCODE)" }
          if (-not (Test-Path mycastreceiver033.exe)) { throw "Missing MSVC output executable" }
      - name: Native composer regression
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new(1920,1080)
          $g = [System.Drawing.Graphics]::FromImage($image)
          $g.Clear([System.Drawing.Color]::CornflowerBlue)
          $image.Save("$pwd/test.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $g.Dispose()
          $image.Dispose()
          python windows/keyboard_test.py test.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
